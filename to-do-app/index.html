<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Tareas</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css" />
  <!-- jQuery UI -->
  <link rel="stylesheet" href="libs/jquery-ui/jquery-ui.min.css" />
  <!-- DataTables -->
  <link rel="stylesheet" href="libs/datatables/jquery.dataTables.min.css" />
  <!-- Alertify -->
  <link rel="stylesheet" href="libs/alertify/css/alertify.min.css" />
  <link rel="stylesheet" href="libs/alertify/css/themes/bootstrap.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <!-- Estilo propio -->
  <link rel="stylesheet" href="css/style.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    @media (max-width: 768px) {
      .card {
        padding: 1rem;
      }
      .form-label {
        font-size: 14px;
      }
      .btn {
        width: 100%;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">Gestión de Tareas</h1>

    <div class="card p-4">
      <h3 class="mb-3 border-bottom pb-2">Agregar Empleado</h3>
      <form id="formEmpleado">
        <div class="mb-3">
          <label for="nombreEmpleado" class="form-label">Nombre del empleado:</label>
          <input type="text" id="nombreEmpleado" name="nombreEmpleado" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus"></i> Agregar Empleado</button>
      </form>
    </div>

    <div class="card p-4">
      <h3 class="mb-3 border-bottom pb-2">Asignar Tarea</h3>
      <form id="formTarea">
        <div class="mb-3">
          <label for="descripcionTarea" class="form-label">Descripción de la tarea:</label>
          <input type="text" id="descripcionTarea" name="descripcionTarea" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="empleadoAsignado" class="form-label">Empleado asignado:</label>
          <select id="empleadoAsignado" name="empleadoAsignado" class="form-select" required></select>
        </div>
        <div class="mb-3">
          <label for="prioridad" class="form-label">Prioridad:</label>
          <select id="prioridad" name="prioridad" class="form-select" required>
            <option value="">Seleccione prioridad</option>
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Asignar Tarea</button>
          <button type="reset" class="btn btn-secondary">Limpiar</button>
        </div>
      </form>
    </div>

    <div class="card p-4">
      <h3 class="mb-3 border-bottom pb-2">Lista de Tareas</h3>
      <div class="table-responsive">
        <table id="tablaTareas" class="display table table-bordered table-hover">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Descripción</th>
              <th>Empleado</th>
              <th>Prioridad</th>
              <th>Estado</th>
              <th>Eliminar</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="libs/jquery/jquery.min.js"></script>
  <script src="libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="libs/datatables/jquery.dataTables.min.js"></script>
  <script src="libs/alertify/alertify.min.js"></script>
  <script src="libs/validate/jquery.validate.min.js"></script>
  <script src="libs/validate/messages_es.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
